name: AcmeBank
options:
  bundleIdPrefix: com.acmebank
  deploymentTarget:
    iOS: "17.0"
packages:
  # Okta's modern Swift SDK.  We depend on the `OktaDirectAuth` product
  # ONLY — never `WebAuthenticationUI`, `OktaOidc` (legacy), `OAuth2`,
  # or `AuthFoundation` (transitively pulled in by OktaDirectAuth).
  okta-mobile-swift:
    url: https://github.com/okta/okta-mobile-swift
    from: "2.0.0"
targets:
  AcmeBank:
    type: application
    platform: iOS
    sources: [AcmeBank]
    dependencies:
      - package: okta-mobile-swift
        product: OktaDirectAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acmebank.mobile
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: AcmeBank
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CODE_SIGN_ENTITLEMENTS: AcmeBank/AcmeBank.entitlements
    # Run-Script build phase that bridges build-machine env vars
    # (OKTA_ISSUER / OKTA_CLIENT_ID / OKTA_REDIRECT_URI / OKTA_SCOPES)
    # into the bundled Info.plist via `plutil -replace`.  Runs AFTER
    # the resource processing phase so it patches the final, generated
    # Info.plist at ${TARGET_BUILD_DIR}/${INFOPLIST_PATH}.
    #
    # When any env var is unset, the `${VAR:-OKTA_NOT_CONFIGURED}`
    # shell default-expansion writes the sentinel string instead — we
    # NEVER hard-fail the build, so a fresh `git clone && xcodebuild`
    # always succeeds.  `OktaConfig.load()` detects the sentinel at
    # runtime and returns `.notConfigured(reason:)`.
    postBuildScripts:
      - name: Inject Okta config into Info.plist
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ ! -f "$PLIST" ]; then
            echo "warning: Info.plist not found at $PLIST — skipping Okta injection"
            exit 0
          fi
          plutil -replace OktaIssuer      -string "${OKTA_ISSUER:-OKTA_NOT_CONFIGURED}"       "$PLIST"
          plutil -replace OktaClientID    -string "${OKTA_CLIENT_ID:-OKTA_NOT_CONFIGURED}"    "$PLIST"
          plutil -replace OktaRedirectURI -string "${OKTA_REDIRECT_URI:-OKTA_NOT_CONFIGURED}" "$PLIST"
          plutil -replace OktaScopes      -string "${OKTA_SCOPES:-OKTA_NOT_CONFIGURED}"       "$PLIST"
  AcmeBankTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AcmeBankTests]
    dependencies:
      - target: AcmeBank
  AcmeBankUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AcmeBankUITests]
    dependencies:
      - target: AcmeBank
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
schemes:
  AcmeBank:
    build:
      targets: { AcmeBank: all }
    test:
      targets: [AcmeBankTests, AcmeBankUITests]
      parallelizable: false
